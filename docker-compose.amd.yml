# Docker Compose - AMD Host Friendly Mode
# 适用于 AMD 主机部署，移除 NVIDIA 设备声明。
#
# 注意：当前镜像 ericwong/mineru:mcp-3.4.3 不是专用 ROCm 镜像，
# 因此这个 compose 默认更适合：
# 1) pipeline CPU 路径
# 2) hybrid-http-client / vlm-http-client 远程 VLM 路径
#
# 如果后续镜像内置了 ROCm 运行时，可取消注释下方 devices/group_add，
# 并将 MINERU_DEVICE_MODE 覆盖为 cuda。

services:
  mineru-mcp:
    image: ericwong/mineru:mcp-3.4.3
    container_name: mineru-mcp-amd

    ports:
      - "8002:8002"  # 单端口（MCP + API + MinerU Native）

    volumes:
      - ./output:/app/output
      - ./input:/app/input:ro
      - ./models:/root/.cache  # 模型缓存持久化（HuggingFace + ModelScope）

    environment:
      # MinerU VLM 配置
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-}
      - MINERU_VL_API_KEY=${MINERU_VL_API_KEY:-}
      - MINERU_VL_MODEL_NAME=${MINERU_VL_MODEL_NAME:-}
      - MINERU_VLM_MAX_CONCURRENCY=${MINERU_VLM_MAX_CONCURRENCY:-2}
      - MINERU_DEFAULT_BACKEND=${MINERU_DEFAULT_BACKEND:-pipeline}
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-modelscope}
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      - HF_HOME=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - MINERU_TOOLS_CONFIG_JSON=${MINERU_TOOLS_CONFIG_JSON:-.mineru/mineru.json}

      # AMD 主机默认建议走 CPU 或远程 VLM；如镜像内置 ROCm，可覆写为 cuda
      - MINERU_DEVICE_MODE=${MINERU_DEVICE_MODE:-cpu}

      # 标题优化 LLM 配置（预留）
      - MINERU_TITLE_BASE_URL=${MINERU_TITLE_BASE_URL:-}
      - MINERU_TITLE_API_KEY=${MINERU_TITLE_API_KEY:-}
      - MINERU_TITLE_MODEL=${MINERU_TITLE_MODEL:-}
      - MINERU_OUTPUT_ROOT=/app/output

      # MCP Server 配置
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-MinerU MCP Server}
      - MCP_SERVER_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8002
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - MCP_HTTP_AUTH_TOKEN=${MCP_HTTP_AUTH_TOKEN:-}

      # 任务队列配置
      - MINERU_MAX_CONCURRENT=${MINERU_MAX_CONCURRENT:-3}
      - MINERU_TASK_TIMEOUT=${MINERU_TASK_TIMEOUT:-3600}
      - MINERU_RETRY_LIMIT=${MINERU_RETRY_LIMIT:-3}
      - MINERU_CLEANUP_DAYS=${MINERU_CLEANUP_DAYS:-300}

      # CORS 配置
      - MINERU_CORS_ORIGINS=${MINERU_CORS_ORIGINS:-*}

    # 若后续使用内置 ROCm 镜像，可启用以下设置
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    # shm_size: '8gb'
    # group_add:
    #   - video
    #   - render

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
