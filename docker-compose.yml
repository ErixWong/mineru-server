# Docker Compose - All-in-One Mode
# MinerU MCP Server (MCP + API + MinerU Native in one process)

services:
  vlm-server:
    image: vllm/vllm-openai:v0.21.0
    container_name: mineru-vlm-server

    ports:
      - "30000:30000"

    volumes:
      # 本地 VLM 模型目录。将模型解压/下载到 ./models/vllm 后，容器内统一从 /models 读取。
      - ./models/vllm:/models
      # HuggingFace 缓存持久化，避免容器重建后重复下载。
      - ./models/cache/huggingface:/root/.cache/huggingface

    command:
      - --model
      - ${VLLM_MODEL_PATH:-/models/MinerU2.5-Pro-2605-1.2B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-MinerU2.5-Pro-2605-1.2B}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --dtype
      - auto
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --trust-remote-code

    environment:
      - HF_HOME=/root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mineru-mcp:
    image: ericwong/mineru:mcp-3.4.4.2
    container_name: mineru-mcp-all-in-one
    
    ports:
      - "8002:8002"  # 单端口（MCP + API + MinerU Native）
    
    volumes:
      - ./output:/app/output
      - ./input:/app/input:ro
      - ./models/cache:/root/.cache  # MinerU 缓存目录（HuggingFace + ModelScope）
    
    environment:
      # MinerU VLM 配置
      # MINERU_DEFAULT_BACKEND 可选值：
      #   pipeline           - 传统流水线，无 VLM，适合纯本地/无远程模型场景
      #   vlm-auto-engine    - 本地 VLM 推理，仅中英文，需本地 VLM 运行时
      #   vlm-http-client    - 远程 VLM API，仅中英文，依赖 OpenAI-compatible 服务
      #   hybrid-auto-engine - 本地 OCR + 本地 VLM，需本地模型与推理环境
      #   hybrid-http-client - 本地 OCR + 远程 VLM，当前默认推荐
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-http://vlm-server:30000/v1}
      - MINERU_VL_API_KEY=${MINERU_VL_API_KEY:-}
      - MINERU_VL_MODEL_NAME=${MINERU_VL_MODEL_NAME:-MinerU2.5-Pro-2605-1.2B}
      - MINERU_VLM_MAX_CONCURRENCY=${MINERU_VLM_MAX_CONCURRENCY:-2}
      - MINERU_DEFAULT_BACKEND=${MINERU_DEFAULT_BACKEND:-hybrid-http-client}
      - MINERU_VLLM_DEVICE=${MINERU_VLLM_DEVICE:-cuda}
      - VLLM_USE_V1=${VLLM_USE_V1:-1}
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-modelscope}
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      - HF_HOME=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - MINERU_TOOLS_CONFIG_JSON=${MINERU_TOOLS_CONFIG_JSON:-.mineru/mineru.json}
      
      # 标题优化 LLM 配置（预留）
      - MINERU_TITLE_BASE_URL=${MINERU_TITLE_BASE_URL:-}
      - MINERU_TITLE_API_KEY=${MINERU_TITLE_API_KEY:-}
      - MINERU_TITLE_MODEL=${MINERU_TITLE_MODEL:-}
      - MINERU_OUTPUT_ROOT=/app/output
      
      # MCP Server 配置
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-MinerU MCP Server}
      - MCP_SERVER_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8002
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}

      # Admin Console 配置
      - MINERU_ADMIN_INITIAL_PASSWORD=${MINERU_ADMIN_INITIAL_PASSWORD:-admin123}
      
# 任务队列配置
      # 注意：MINERU_MAX_CONCURRENT 是全局默认值（适用于所有后端）
      # 本地 VLM 调试建议设置为 1 以避免显存溢出，生产环境可根据资源调整
      # 如需区分本地调试和生产默认值，请通过环境变量覆盖
      - MINERU_MAX_CONCURRENT=${MINERU_MAX_CONCURRENT:-3}
      - MINERU_TASK_TIMEOUT=${MINERU_TASK_TIMEOUT:-3600}
      - MINERU_RETRY_LIMIT=${MINERU_RETRY_LIMIT:-3}
      - MINERU_CLEANUP_DAYS=${MINERU_CLEANUP_DAYS:-300}
      
      # CORS 配置
      - MINERU_CORS_ORIGINS=${MINERU_CORS_ORIGINS:-*}
    
    # GPU 支持（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: unless-stopped

    depends_on:
      vlm-server:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 说明：
# - 当前 compose 默认走 hybrid-http-client，MinerU 通过 MINERU_VL_SERVER 访问同 compose 内的 vlm-server。
# - ./models/vllm 是“模型挂载点”，请把供 vLLM 直接加载的模型目录放在这里，例如：
#   ./models/vllm/MinerU2.5-Pro-2605-1.2B
# - ./models/cache 是“缓存挂载点”，供 MinerU / HuggingFace / ModelScope 复用下载缓存。
# - 如需切回 MinerU 进程内本地引擎，可将 MINERU_DEFAULT_BACKEND 覆盖为 hybrid-auto-engine，
#   并移除或忽略独立 vlm-server。
