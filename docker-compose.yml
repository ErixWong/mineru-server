# Docker Compose - All-in-One Mode
# MinerU MCP Server (MCP + API + MinerU Native in one process)

services:
  mineru-mcp:
    image: ericwong/mineru:mcp-3.4.4
    container_name: mineru-mcp-all-in-one
    
    ports:
      - "8002:8002"  # 单端口（MCP + API + MinerU Native）
    
    volumes:
      - ./output:/app/output
      - ./input:/app/input:ro
      - ./models:/root/.cache  # MinerU 模型缓存持久化（HuggingFace + ModelScope）
    
    environment:
      # MinerU VLM 配置
      # MINERU_DEFAULT_BACKEND 可选值：
      #   pipeline           - 传统流水线，无 VLM，适合纯本地/无远程模型场景
      #   vlm-auto-engine    - 本地 VLM 推理，仅中英文，需本地 VLM 运行时
      #   vlm-http-client    - 远程 VLM API，仅中英文，依赖 OpenAI-compatible 服务
      #   hybrid-auto-engine - 本地 OCR + 本地 VLM，需本地模型与推理环境
      #   hybrid-http-client - 本地 OCR + 远程 VLM，当前默认推荐
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-}
      - MINERU_VL_API_KEY=${MINERU_VL_API_KEY:-}
      - MINERU_VL_MODEL_NAME=${MINERU_VL_MODEL_NAME:-}
      - MINERU_VLM_MAX_CONCURRENCY=${MINERU_VLM_MAX_CONCURRENCY:-2}
      - MINERU_DEFAULT_BACKEND=${MINERU_DEFAULT_BACKEND:-hybrid-auto-engine}
      - MINERU_VLLM_DEVICE=${MINERU_VLLM_DEVICE:-cuda}
      - VLLM_USE_V1=${VLLM_USE_V1:-1}
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-modelscope}
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      - HF_HOME=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - MINERU_TOOLS_CONFIG_JSON=${MINERU_TOOLS_CONFIG_JSON:-.mineru/mineru.json}
      
      # 标题优化 LLM 配置（预留）
      - MINERU_TITLE_BASE_URL=${MINERU_TITLE_BASE_URL:-}
      - MINERU_TITLE_API_KEY=${MINERU_TITLE_API_KEY:-}
      - MINERU_TITLE_MODEL=${MINERU_TITLE_MODEL:-}
      - MINERU_OUTPUT_ROOT=/app/output
      
      # MCP Server 配置
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-MinerU MCP Server}
      - MCP_SERVER_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8002
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}

      # Admin Console 配置
      - MINERU_ADMIN_INITIAL_PASSWORD=${MINERU_ADMIN_INITIAL_PASSWORD:-admin123}
      
# 任务队列配置
      # 注意：MINERU_MAX_CONCURRENT 是全局默认值（适用于所有后端）
      # 本地 VLM 调试建议设置为 1 以避免显存溢出，生产环境可根据资源调整
      # 如需区分本地调试和生产默认值，请通过环境变量覆盖
      - MINERU_MAX_CONCURRENT=${MINERU_MAX_CONCURRENT:-3}
      - MINERU_TASK_TIMEOUT=${MINERU_TASK_TIMEOUT:-3600}
      - MINERU_RETRY_LIMIT=${MINERU_RETRY_LIMIT:-3}
      - MINERU_CLEANUP_DAYS=${MINERU_CLEANUP_DAYS:-300}
      
      # CORS 配置
      - MINERU_CORS_ORIGINS=${MINERU_CORS_ORIGINS:-*}
    
    # GPU 支持（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 说明：
# - 如果使用 hybrid-auto-engine / vlm-auto-engine，MinerU 会在当前进程内直接初始化本地 VLM 引擎，
#   不需要额外定义独立的 VLM Server 容器。
# - 只有在使用 hybrid-http-client / vlm-http-client，并且你希望“本机或同一组 compose 容器内”
#   额外跑一个 OpenAI-compatible VLM 服务时，才需要下面这种独立 vlm-server。
# - 这类 vlm-server 通常是 vllm serve / LMDeploy 等单独服务，MinerU 主服务通过 MINERU_VL_SERVER 指向它。
# - 当前镜像默认安装 MinerU 的 vLLM 扩展，`vlm-auto-engine` 在 Linux 下会优先尝试进程内 `vllm`
#   引擎；如 `import vllm` 失败，才会退回 lmdeploy / transformers。
# - 本地 VLM 初始建议将 `MINERU_MAX_CONCURRENT` 控制为 1，确认显存和吞吐后再提升并发。
#
# 可选：仅供 *-http-client 模式参考的独立 VLM Server
# services:
#   vlm-server:
#     image: your-vlm-image:latest
#     ports:
#       - "30000:30000"
#     environment:
#       - VLM_MODEL=your-model
