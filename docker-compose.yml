# Docker Compose - Default Remote-VLM Mode
# MinerU MCP Server (MCP + API + MinerU Native in one process)
#
# Runtime configuration is injected from the host environment or an explicit
# external --env-file. Do not bake secrets into the image.

services:
  vlm-server:
    image: vllm/vllm-openai:v0.21.0
    container_name: mineru-vlm-server

    ports:
      - "30000:30000"

    volumes:
      # 与 mineru-mcp 共用同一份模型目录（HuggingFace + ModelScope）。
      - ./models:/root/.cache

    command:
      - --model
      - ${VLLM_MODEL_PATH:-/root/.cache/modelscope/models/OpenDataLab/MinerU2.5-Pro-2605-1.2B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-MinerU2.5-Pro-2605-1.2B}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --dtype
      - auto
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --trust-remote-code

    environment:
      - HF_HOME=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mineru-mcp:
    image: ericwong/mineru:mcp-3.4.4.2
    container_name: mineru-mcp-all-in-one
    
    ports:
      - "8002:8002"  # 单端口（MCP + API + MinerU Native）
    
    volumes:
      - ./output:/app/output
      - ./input:/app/input:ro
      - ./models:/root/.cache  # MinerU 模型目录（HuggingFace + ModelScope）
    
    environment:
      # MinerU VLM 配置
      # 本 compose 模板默认面向 remote VLM 模式：
      # - mineru-mcp 默认使用 hybrid-http-client
      # - 通过 MINERU_VL_SERVER 访问同 compose 内的 vlm-server
      # - 因此 mineru-mcp 默认依赖 vlm-server healthy 后再启动
      #
      # MINERU_DEFAULT_BACKEND 可选值：
      #   pipeline           - 传统流水线，无 VLM，适合纯本地/无远程模型场景
      #   vlm-auto-engine    - 本地 VLM 推理，仅中英文，需本地 VLM 运行时
      #   vlm-http-client    - 远程 VLM API，仅中英文，依赖 OpenAI-compatible 服务
      #   hybrid-auto-engine - 本地 OCR + 本地 VLM，需本地模型与推理环境
      #   hybrid-http-client - 本地 OCR + 远程 VLM，当前默认推荐
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-http://vlm-server:30000/v1}
      - MINERU_VL_API_KEY=${MINERU_VL_API_KEY:-}
      - MINERU_VL_MODEL_NAME=${MINERU_VL_MODEL_NAME:-MinerU2.5-Pro-2605-1.2B}
      - MINERU_VLM_MAX_CONCURRENCY=${MINERU_VLM_MAX_CONCURRENCY:-2}
      - MINERU_DEFAULT_BACKEND=${MINERU_DEFAULT_BACKEND:-hybrid-http-client}
      - MINERU_VLLM_DEVICE=${MINERU_VLLM_DEVICE:-cuda}
      - VLLM_USE_V1=${VLLM_USE_V1:-1}
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-modelscope}
      - HF_ENDPOINT=${HF_ENDPOINT:-}
      - HF_HOME=/root/.cache/huggingface
      - MODELSCOPE_CACHE=/root/.cache/modelscope

      # 标题优化 LLM 配置（预留）
      - MINERU_TITLE_BASE_URL=${MINERU_TITLE_BASE_URL:-}
      - MINERU_TITLE_API_KEY=${MINERU_TITLE_API_KEY:-}
      - MINERU_TITLE_MODEL=${MINERU_TITLE_MODEL:-}
      - MINERU_OUTPUT_ROOT=/app/output

      # 后处理配置
      # MINERU_POSTPROCESS_CONTEXT_SIZE：后处理每个分片的原文预算，单位为字符数（非 tokens）。
      # 作为创建任务时未显式指定 context size 的全局默认值；代码内下限为 4096。
      # 注意：该预算只计量送入的原文长度，规则 prompt、系统提示与模型输出都额外占用模型窗口，
      # 因此应设置为显著低于所用 LLM 实际上下文窗口的值。
      - MINERU_POSTPROCESS_CONTEXT_SIZE=${MINERU_POSTPROCESS_CONTEXT_SIZE:-131072}
      
      # MCP Server 配置
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-MinerU MCP Server}
      - MCP_SERVER_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8002
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}

      # Admin Console 配置
      - MINERU_ADMIN_INITIAL_PASSWORD=${MINERU_ADMIN_INITIAL_PASSWORD:-admin123}
      # Caller API key encryption master key (runtime secret; inject from host/CI/external env file)
      - MINERU_CALLER_KEY_MASTER_KEY=${MINERU_CALLER_KEY_MASTER_KEY:?Set MINERU_CALLER_KEY_MASTER_KEY in the host environment or an external --env-file}
      # 是否启用 Admin 写接口 same-origin 校验；临时排障可设为 false（会削弱浏览器侧 CSRF 防护，CSRF token 校验仍保留）
      - MINERU_ADMIN_SAME_ORIGIN_CHECK=${MINERU_ADMIN_SAME_ORIGIN_CHECK:-true}
      # 是否信任反向代理注入的 X-Forwarded-* / Forwarded 头；仅在确认 frp/nginx 会覆盖客户端同名头时开启
      - MINERU_ADMIN_TRUST_PROXY_HEADERS=${MINERU_ADMIN_TRUST_PROXY_HEADERS:-false}
      # 公网反向代理访问 Admin 控制台时，填浏览器实际访问的外部 Origin，例如：https://ocr.example.com
      - MINERU_ADMIN_ALLOWED_ORIGINS=${MINERU_ADMIN_ALLOWED_ORIGINS:-http://127.0.0.1:5180,http://localhost:5180}
      
# 任务队列配置
      # 注意：MINERU_MAX_CONCURRENT 是全局默认值（适用于所有后端）
      # 本地 VLM 调试建议设置为 1 以避免显存溢出，生产环境可根据资源调整
      # 如需区分本地调试和生产默认值，请通过环境变量覆盖
      - MINERU_MAX_CONCURRENT=${MINERU_MAX_CONCURRENT:-3}
      - MINERU_TASK_TIMEOUT=${MINERU_TASK_TIMEOUT:-3600}
      - MINERU_RETRY_LIMIT=${MINERU_RETRY_LIMIT:-3}
      - MINERU_CLEANUP_DAYS=${MINERU_CLEANUP_DAYS:-300}
      
      # CORS 配置
      # 仅对公开 OCR API 生效；Admin 页面与 Admin API 仍由 same-origin + CSRF 保护
      - MINERU_CORS_ORIGINS=${MINERU_CORS_ORIGINS:-*}
    
    # GPU 支持（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: unless-stopped

    # 说明：
    # - 若继续使用默认的 hybrid-http-client / vlm-http-client，则保留对 vlm-server 的依赖。
    # - 若切换到 vlm-auto-engine / hybrid-auto-engine / pipeline，本 compose 不再是开箱即用模板；
    #   应同时移除或忽略 vlm-server 与 depends_on，并按本地运行时要求准备 MinerU 依赖。
    depends_on:
      vlm-server:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 说明：
# - 当前 compose 默认走 hybrid-http-client，MinerU 通过 MINERU_VL_SERVER 访问同 compose 内的 vlm-server。
# - vlm-server 与 mineru-mcp 现在共用同一份 ./models:/root/.cache 持久化目录。
# - vLLM 默认从 ModelScope 缓存目录加载模型：
#   /root/.cache/modelscope/hub/models/OpenDataLab/MinerU2.5-Pro-2605-1.2B
# - 如服务器上的实际缓存目录不同，请通过 VLLM_MODEL_PATH 覆盖为真实路径。
# - 如需切回 MinerU 进程内本地引擎，可将 MINERU_DEFAULT_BACKEND 覆盖为 hybrid-auto-engine，
#   并同步移除或忽略独立 vlm-server / depends_on；auto-engine 走的是本地 VLM 路径，不依赖独立 HTTP vLLM 服务。
