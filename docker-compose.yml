# Docker Compose - All-in-One Mode
# MinerU MCP Server (MCP + API + MinerU Native in one process)

version: '3.8'

services:
  mineru-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: erix-mineru:all-in-one
    container_name: mineru-mcp-all-in-one
    
    ports:
      - "8001:8001"  # 单端口（MCP + API + MinerU Native）
    
    volumes:
      - ./output:/app/output
      - ./input:/app/input:ro
      - ./models:/root/.cache  # MinerU 模型缓存持久化（HuggingFace + ModelScope）
    
    environment:
      # MinerU VLM 配置
      - MINERU_VLM_BASE_URL=${MINERU_VLM_BASE_URL:-}
      - MINERU_VLM_API_KEY=${MINERU_VLM_API_KEY:-}
      - MINERU_VLM_MODEL=${MINERU_VLM_MODEL:-}
      - MINERU_DEFAULT_BACKEND=${MINERU_DEFAULT_BACKEND:-hybrid-http-client}
      - MINERU_OUTPUT_ROOT=/app/output
      
      # MCP Server 配置
      - MCP_SERVER_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8001
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - MCP_HTTP_AUTH_TOKEN=${MCP_HTTP_AUTH_TOKEN:-}
      
      # CORS 配置
      - MINERU_CORS_ORIGINS=${MINERU_CORS_ORIGINS:-*}
    
    # GPU 支持（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 可选：VLM Server（如果使用本地 VLM）
