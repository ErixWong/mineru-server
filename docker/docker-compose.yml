# Docker Compose - All-in-One 模式
# MinerU + MCP Server 在同一容器

version: '3.8'

services:
  mineru-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.all-in-one
    image: erix-mineru:all-in-one
    container_name: mineru-mcp-all-in-one
    
    ports:
      - "8000:8000"  # MinerU FastAPI
      - "8001:8001"  # MCP Server
    
    volumes:
      - ./output:/app/output
      - ./input:/app/input:ro
    
    environment:
      # MinerU 配置
      - MINERU_VLM_BASE_URL=${MINERU_VLM_BASE_URL:-}
      - MINERU_VLM_API_KEY=${MINERU_VLM_API_KEY:-}
      - MINERU_VLM_MODEL=${MINERU_VLM_MODEL:-}
      - MINERU_DEFAULT_BACKEND=${MINERU_DEFAULT_BACKEND:-hybrid-http-client}
      - MINERU_OUTPUT_ROOT=/app/output
      
      # MCP Server 配置
      - MINERU_API_BASE=http://localhost:8000
      - MCP_SERVER_MODE=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8001
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - MCP_HTTP_AUTH_TOKEN=${MCP_HTTP_AUTH_TOKEN:-}
      
      # CORS 配置
      - MINERU_CORS_ORIGINS=${MINERU_CORS_ORIGINS:-*}
    
    # GPU 支持（可选）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 可选：VLM Server（如果使用本地 VLM）
